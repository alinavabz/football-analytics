name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Same hooks as local pre-commit. Gitleaks runs in its own job against full history.
      - name: Run pre-commit hooks
        run: SKIP=gitleaks uvx pre-commit run --all-files --show-diff-on-failure

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Create CI environment file
        run: cp .env.example .env
      - name: Start database stack
        run: make up
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: make test
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: make down
